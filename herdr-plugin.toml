id = "herdr-nudge"
name = "Herdr Nudge"
version = "1.0.2"
description = "macOS notifications when an agent or a long shell command needs you"
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[startup]]
command = ["./bin/herdr-nudge", "--cleanup"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-nudge"]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-nudge"]

# Herdr 0.9.1 sends this when the user moves to a pane by hand; 0.9.0 only
# for focus asked for through the API.
[[events]]
on = "pane.focused"
command = ["./bin/herdr-nudge"]

# Closing a tab or a workspace sends no pane.closed for the panes in it.
[[events]]
on = "tab.closed"
command = ["./bin/herdr-nudge"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-nudge"]
