[package]
name = "herdr-nudge"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "macOS notifications for Herdr panes, click to focus the pane"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

# The release binary is committed, so every byte of it is repo history.
# This makes it about a third smaller.
[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
